<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          if (theme === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Khalid Mohamed — Developer and Network & Security Engineer. I build the apps people use, and understand the infrastructure they run on." />
    <meta name="author" content="Khalid Mohamed" />
    <meta name="theme-color" content="#050816" />
    <link rel="canonical" href="https://khalidmued.com/" />
    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khalidmued.com/" />
    <meta property="og:title" content="Khalid Mohamed | Developer & Network Security Engineer" />
    <meta property="og:description" content="Developer and Network & Security Engineer — building apps, securing networks, and running the infrastructure between them." />
    <!-- A raster card, not logo.svg: every link-preview crawler (LinkedIn, X,
         Facebook, Slack, WhatsApp) ignores SVG and renders no image at all.
         1200x630 is the 1.91:1 box they lay the card out in. Regenerate with
         `npm run og:card` — see scripts/generate-og-card.mjs. -->
    <meta property="og:image" content="https://khalidmued.com/og-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Khalid Mohamed — Developer and Network &amp; Security Engineer. I build the apps people use, and the infrastructure they depend on." />
    <meta property="og:site_name" content="Khalid Mohamed" />
    <meta property="og:locale" content="en_US" />
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Khalid Mohamed | Developer & Network Security Engineer" />
    <meta name="twitter:description" content="Developer and Network & Security Engineer — building apps, securing networks, and running the infrastructure between them." />
    <meta name="twitter:image" content="https://khalidmued.com/og-card.png" />
    <meta name="twitter:image:alt" content="Khalid Mohamed — Developer and Network &amp; Security Engineer." />
    <title> Khalid Mohamed | Developer & Network Security Engineer </title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
